name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/worker.js
      - run: node --check src/validation.js
      - run: node --check public/app.js
      - run: node --test tests/*.test.js
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx wrangler d1 migrations apply DB --local
      - run: printf 'SETUP_TOKEN=test-setup-token-123456789\n' > .dev.vars
      - name: Worker and D1 end-to-end smoke test
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/chamber-wrangler.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID || true; cat /tmp/chamber-wrangler.log' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 2
          done
          node tests/smoke.mjs
