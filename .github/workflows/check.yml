name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check src/worker.js
      - run: node --check src/validation.js
      - run: node --check src/mfa.js
      - run: node --test tests/*.test.js
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --local
      - run: printf 'SETUP_TOKEN=test-setup-token-123456789\nMFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n' > .dev.vars
      - name: Worker and D1 end-to-end smoke test
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/chamber-wrangler.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID || true; cat /tmp/chamber-wrangler.log' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            if ! kill -0 $WORKER_PID 2>/dev/null; then cat /tmp/chamber-wrangler.log; exit 1; fi
            sleep 1
          done
          node tests/smoke.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --local
      - run: printf 'SETUP_TOKEN=test-setup-token-123456789\\nMFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\\n' > .dev.vars
      - name: Browser workflows and accessibility
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chamber-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 5
